<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Ashton & Robert Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles/default.css">
  <link rel="stylesheet" href="styles/survey.css">
  <link rel="stylesheet" href="styles/captcha.css">
</head>

<body>
  <div id="overlay-container">

    <div id="buffer-container" class="hidden">
      <div id="spinner"></div>
      <div id="buffering-text">Buffering...</div>
    </div>

    <button id="skip" type="button" disabled>
      Skip Ad...
    </button>
  </div>

  <div id="survey-container" class="hidden">
    <div id="survey-inner">
      <div id="survey-header">
        Complete this survey to skip the video
        <br>
      </div>
      <div id="survey-error" class="hidden">
        Error
      </div>
      <div id="star-question" class="survey-question"> 
        <div>
          Please rate the ad.
        </div>
        <div id="stars" style="display: flex; gap: .2rem;"> 
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
        </div>
      </div>
      <div id="essay1-question" class="hidden">
        <div>
          Thanks for leaving 5 stars! Let us know what you like about the advertisement.
        </div>
        <div>
          <textarea id="essay1-text" required></textarea>
          <button id="next-question">Next Question</button>
        </div>
      </div>
      <div id="essay2-question" class="hidden">
        <div>
          How does this advertisement relate to you?
        </div>
        <div>
          <textarea id="essay2-text" required></textarea>
          <button id="next-question">Next Question</button> 
       </div>
      </div>
      <div id="survey-end" class="hidden">
        <div>
          Thank you for completing the survey. Please verify you're a human.
        </div>
        <div>
          <button id="next-question">Verify</button> 
       </div>
      </div>
    </div>
  </div>

  <div id="captcha-container">
    <div id="captcha-inner" class="state1">
      <div id="captcha-state-1" style="display: flex; width: 100%; align-items: center; justify-content: space-between;">
        <div style="display: flex; flex-direction: row; align-items: center; gap: 1rem;">
          <button class="captcha-clickarea" id="captcha-start"></button>
          <div id="captcha-spinner" class="hidden">
            <div id="spinner" style="width:24px; height: 24px; border: 4px solid rgba(255, 255, 255, .5); border-top-color: black;"></div>
          </div>
          <div>I'm not a robot</div>
        </div>
        <div style="width: 3rem;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M544.1 256L552 256C565.3 256 576 245.3 576 232L576 88C576 78.3 570.2 69.5 561.2 65.8C552.2 62.1 541.9 64.2 535 71L483.3 122.8C439 86.1 382 64 320 64C191 64 84.3 159.4 66.6 283.5C64.1 301 76.2 317.2 93.7 319.7C111.2 322.2 127.4 310 129.9 292.6C143.2 199.5 223.3 128 320 128C364.4 128 405.2 143 437.7 168.3L391 215C384.1 221.9 382.1 232.2 385.8 241.2C389.5 250.2 398.3 256 408 256L544.1 256zM573.5 356.5C576 339 563.8 322.8 546.4 320.3C529 317.8 512.7 330 510.2 347.4C496.9 440.4 416.8 511.9 320.1 511.9C275.7 511.9 234.9 496.9 202.4 471.6L249 425C255.9 418.1 257.9 407.8 254.2 398.8C250.5 389.8 241.7 384 232 384L88 384C74.7 384 64 394.7 64 408L64 552C64 561.7 69.8 570.5 78.8 574.2C87.8 577.9 98.1 575.8 105 569L156.8 517.2C201 553.9 258 576 320 576C449 576 555.7 480.6 573.4 356.5z" /></svg>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/index.js"></script>
  <script src="scripts/captcha.js"></script>
  <script src="scripts/negative.js"></script>
  <script src="scripts/survey.js"></script>
  <script src="scripts/buffer.js"></script>
</body>

</html>
