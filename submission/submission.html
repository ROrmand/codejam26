<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Ashton & Robert Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles/default.css">
  <link rel="stylesheet" href="styles/survey.css">
</head>

<body>
  <div id="overlay-container">

    <div id="buffer-container" class="hidden">
      <div id="spinner"></div>
      <div id="buffering-text">Buffering...</div>
    </div>

    <button id="skip" type="button" disabled>
      Skip Ad...
    </button>
  </div>

  <div id="survey-container" class="hidden">
    <div id="survey-inner">
      <div id="survey-header">
        Complete this survey to skip the video
        <br>
      </div>
      <div id="survey-error" class="hidden">
        Error
      </div>
      <div id="star-question" class="survey-question"> 
        <div>
          Please rate the ad.
        </div>
        <div id="stars" style="display: flex; gap: .2rem;"> 
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
          <div class="star">★</div>
        </div>
      </div>
      <div>
      <div id="essay1-question" class="hidden">
        <div>
          Thanks for leaving 5 stars! Let us know what you like about the advertisement.
        </div>
        <div>
          <textarea id="essay1-text" required></textarea>
          <button id="next-question">Next Question</button>      </div>
      </div>
      <div id="essay2-question" class="hidden">
        <div>
          How does this advertisement relate to you?
        </div>
        <div>
          <textarea id="essay2-text" required></textarea>
          <button id="next-question">Next Question</button> 
       </div>
      </div>
      <div id="survey-end" class="hidden">
        <div>
          Thank you for completing the survey. Please verify you're a human.
        </div>
        <div>
          <button id="next-question">Verify</button> 
       </div>
      </div>
    </div>
  </div>

</body>

</html>

<script src="scripts/index.js"></script>
<script src="scripts/captcha.js"></script>
<script src="scripts/negative.js"></script>
<script src="scripts/survey.js"></script>
<script src="scripts/buffer.js"></script>
